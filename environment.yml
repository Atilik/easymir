name: mireasy
channels:
  # conda-forge ONLY. The Anaconda 'defaults' channels are deliberately
  # excluded (nodefaults): since 2025 they require interactive Terms-of-
  # Service acceptance, which silently breaks non-interactive installs
  # on a fresh Miniconda (CondaToSNonInteractiveError).
  - conda-forge
  - nodefaults
dependencies:
  # ── Interpreter + build/system stack (conda) ──
  - python=3.11
  - cython              # required to build madmom from source
  - ffmpeg              # mp3/m4a decoding
  - libsndfile
  - ipykernel
  - pip
  # ── Python packages (pip, pinned) ──
  # numpy comes from pip, NOT conda: conda-forge's numpy links an OpenMP
  # runtime that clashes with the one bundled in pip's torch — a hard crash
  # for any process that imports torch before numpy.
  - pip:
      - numpy==2.4.6
      - torch==2.8.0
      - torchaudio==2.8.0
      - scipy>=1.13,<2
      - matplotlib>=3.9,<4
      - librosa==0.11.0
      - soundfile==0.14.0
      - sounddevice==0.5.5
      - pyloudnorm==0.2.0
      - mir_eval==0.8.2
      - demucs==4.0.1
      - essentia-tensorflow==2.1b6.dev1389
      - pytest==8.4.2
      # madmom: installed from the prebuilt wheel bundled in wheels/ so that
      # NOTHING compiles on the user's machine (novice installs kept failing
      # at the C build). Built from CPJKU/madmom@27f032e against numpy 2.4 —
      # provenance, sha256 and rebuild instructions: wheels/README.md.
      # (Linux: no bundled wheel — see wheels/README.md for the one-liner.)
      - ./wheels/madmom-0.17.dev0-cp311-cp311-macosx_11_0_arm64.whl
      # BEAT THIS! beat tracker (ISMIR 2024) — not on PyPI. Bundled as a wheel
      # (pure Python, built from tag v1.1.0) so the install needs NO git —
      # git only exists on fresh Macs via the Xcode tools we no longer require.
      - ./wheels/beat_this-1.1.0-py3-none-any.whl
